name: Set atlas-ai-proxy secrets

# Run this ONCE (or whenever a secret changes) from the Actions tab —
# "Run workflow" button. It pushes VAPID_PRIVATE_KEY and D1_API_KEY into the
# Cloudflare worker's encrypted secrets store using wrangler, so no local
# terminal / wrangler login is needed.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Set VAPID_PRIVATE_KEY
        working-directory: workers/atlas-ai-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.VAPID_PRIVATE_KEY }}" | wrangler secret put VAPID_PRIVATE_KEY
      - name: Set D1_API_KEY (push worker api key)
        working-directory: workers/atlas-ai-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.D1_API_KEY }}" | wrangler secret put D1_API_KEY
