name: OMR API Watchdog Backup

# Independent backup for omr-api-watchdog.yml. Runs on a different offset
# (every 10 minutes, staggered 5 minutes from the primary) so if the
# primary workflow is ever accidentally disabled, misconfigured, or GitHub
# delays/drops one run, this one still keeps the free-tier Render OMR API
# from spinning down after ~15 minutes of no traffic. Same read-only GET,
# no secrets involved.

on:
  schedule:
    - cron: "5-59/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OMR API health endpoint (backup)
        run: |
          curl -fsS --max-time 20 https://medihour-omr-api.onrender.com/health || echo "Ping failed (service may be cold-starting) — not treated as a failure."
