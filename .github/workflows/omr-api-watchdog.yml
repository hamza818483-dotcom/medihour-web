name: OMR API Watchdog

# Pings the Render-hosted OMR API's /health endpoint every 10 minutes so the
# free-tier service never sits idle long enough to spin down (Render free
# instances sleep after ~15 minutes of no traffic). Read-only GET request,
# no secrets involved.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OMR API health endpoint
        run: |
          curl -fsS --max-time 20 https://medihour-omr-api.onrender.com/health || echo "Ping failed (service may be cold-starting) — not treated as a failure."
